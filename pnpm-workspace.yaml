catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
  vitest: 4.1.10
  "@vitest/browser-playwright": 4.1.10
  "@varlock/bumpy": ^1.18.1
  playwright: ^1.54.0

overrides:
  vite: "catalog:"
  vitest: "catalog:"
  "@mantaq/core": "0.1.0"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  esbuild: true

# We deliberately consume first-party mantaq 0.1.0 releases within hours of
# publishing; the release-age gate is pure friction here.
minimumReleaseAge: 0

minimumReleaseAgeExclude:
  - "@mantaq/core@0.1.0"
  - "@mantaq/sugar@0.1.0"
  - "@mantaq/utils@0.0.1"
  - "@mantaq/utils@0.0.2"
  - "@mantaq/test@0.1.0"
  - "@mantaq/traversal@0.1.0"
